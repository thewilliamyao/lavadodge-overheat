<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LavaDodge</title>
<meta name="description" content="Help Olaf dodge the lava. How long can you last?">
<meta name="theme-color" content="#7cc7e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LavaDodge">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="assets/img/icon-180.png">
<link rel="icon" type="image/png" href="assets/img/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #7cc7e0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #safe {
    position: absolute; visibility: hidden; pointer-events: none;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<script src="../shared/core.js"></script>
<script src="../shared/net.js"></script>
<script src="../shared/ui.js"></script>
<script src="game.js"></script>
<script>
  // Offline support + automatic updates: check for a new version when the app is opened or
  // brought back to the foreground; once it's downloaded, reload (only while on a menu).
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        document.addEventListener('visibilitychange', function () { if (!document.hidden) reg.update(); });
        setInterval(function () { reg.update(); }, 10 * 60 * 1000);
      });
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) { hadController = true; return; } // first install: already up to date
        if (window.LD && LD.requestReload) LD.requestReload(); else location.reload();
      });
    });
  }
</script>
</body>
</html>
